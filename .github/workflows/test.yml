name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelflow
          POSTGRES_PASSWORD: travelflow
          POSTGRES_DB: travelflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travelflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma generate & migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://travelflow:travelflow@localhost:5432/travelflow_test
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Typecheck API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://travelflow:travelflow@localhost:5432/travelflow_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret
        run: npm run typecheck

      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck

      - name: Build web
        working-directory: apps/web
        run: npm run build
