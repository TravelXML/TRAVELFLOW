services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelflow
      POSTGRES_PASSWORD: travelflow
      POSTGRES_DB: travelflow_dev
    ports:
      - "5544:5432"
    volumes:
      - travelflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travelflow_pgdata:
